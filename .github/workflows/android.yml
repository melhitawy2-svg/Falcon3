name: Falcon VPN Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Android Project
        run: |
          echo "=== فك ضغط المشروع ==="
          ls -la
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error:: مفيش ملف zip في الجذر"
            exit 1
          fi
          echo "هفك: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          echo "=== بعد الفك ==="
          ls -R extracted | head -n 150

      - name: Find Project Root
        run: |
          ROOT=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "::error:: مش لاقي settings.gradle جوه الzip"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "لقيت المشروع في: $ROOT"
          ls -la $ROOT
          ls -la $ROOT/app 2>/dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew مش موجود، هنبني بـ gradle مباشر"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 10
