name: Falcon VPN Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Android Project Root - FIXED
        id: find_root
        run: |
          echo "=== البحث عن مشروع الأندرويد ==="
          find . -type f -name "settings.gradle*" -o -name "build.gradle*" | head -n 20
          
          ROOT=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          
          if [ -z "$ROOT" ]; then
            echo "::error::لم يتم العثور على settings.gradle في الريبو كله!"
            echo "محتويات الريبو:"
            ls -la
            echo "---"
            ls -R | head -n 100
            exit 1
          fi
          
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "✅ تم العثور على المشروع في: $ROOT"
          ls -la $ROOT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v
