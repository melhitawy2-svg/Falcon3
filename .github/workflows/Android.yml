name: Falcon VPN Android Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract project from ZIP
        run: |
          echo "الملفات في الجذر:"
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "بفك: $ZIP"
          unzip -o -q "$ZIP" -d project_src
          echo "بعد الفك:"
          find project_src -maxdepth 4 -type f -name "settings.gradle*" | head -n 20

      - name: Find real project root
        run: |
          ROOT=$(find project_src -type f -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle مش موجود حتى بعد الفك!"
            find project_src -type f | head -n 100
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "المشروع الحقيقي في: $ROOT"
          ls -la $ROOT

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
