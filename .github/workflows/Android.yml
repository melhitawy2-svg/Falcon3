name: Falcon VPN Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract Falcon VPN Project
        run: |
          if [ -f FalconVPN-Starter.zip ]; then
            unzip -o FalconVPN-Starter.zip -d .
          fi

      - name: Make Gradle Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: gradlew not found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
