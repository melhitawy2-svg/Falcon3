name: Falcon VPN Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Android Project Root
        id: find_root
        run: |
          # هيدور على ملف settings.gradle فين
          ROOT=$(find . -name "settings.gradle*" | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            ROOT=$(find . -name "build.gradle*" | head -n 1 | xargs dirname | xargs dirname)
          fi
          if [ -z "$ROOT" ]; then
            ROOT="."
          fi
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "لقيت المشروع في: $ROOT"
          ls -la $ROOT
          ls -la $ROOT/app || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
