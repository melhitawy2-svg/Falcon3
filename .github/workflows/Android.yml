name: Falcon VPN Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Falcon VPN Project
        run: |
          if [ -f FalconVPN-Starter.zip ]; then
            unzip -o FalconVPN-Starter.zip -d extracted
          else
            echo "ERROR: FalconVPN-Starter.zip not found!"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Locate Gradle Project
        run: |
          GRADLE_FILE=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found in ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          chmod +x "$GRADLE_FILE"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
