name: Falcon VPN Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Android Project Root
        run: |
          echo "=== البحث عن المشروع ==="
          find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 10
          ROOT=$(find . -type f -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            ROOT=$(find . -type f -name "settings.gradle" | head -n 1 | xargs dirname)
          fi
          if [ -z "$ROOT" ]; then
            echo "مش لاقي settings.gradle"
            ls -R | head -n 100
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "لقيت المشروع في: $ROOT"
          ls -la $ROOT

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
