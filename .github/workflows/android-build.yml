name: FalconVPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FalconVPN APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "FalconVPN-Starter.zip" ]; then
            echo "ERROR: FalconVPN-Starter.zip not found in repository root"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted

          unzip -o FalconVPN-Starter.zip -d extracted

          PROJECT_DIR=""

          for FILE in $(find extracted -type f \
            \( -path "*/app/build.gradle.kts" \
            -o -path "*/app/build.gradle" \)); do
            PROJECT_DIR="$(dirname "$(dirname "$FILE")")"
            break
          done

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app folder was not found inside ZIP"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          echo "Project extracted successfully"
          ls -la
          ls -la app

      - name: Verify Gradle project
        run: |
          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && \
             [ ! -f "build.gradle" ]; then
            echo "ERROR: Root build.gradle(.kts) not found"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconVPN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
